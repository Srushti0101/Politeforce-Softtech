<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registered Users</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #667eea;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        /* Action buttons */

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .update-btn {
            display: inline-block;
            padding: 7px 12px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .update-btn:hover {
            background: #5568d8;
        }

        .delete-btn {
            padding: 7px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 700px) {

            .container {
                padding: 20px;
                overflow-x: auto;
            }

            table {
                min-width: 900px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Registered Users</h1>


    {% if users %}

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Action</th>
            </tr>

        </thead>


        <tbody>

            {% for user in users %}

            <tr>

                <td>
                    {{ user.id }}
                </td>

                <td>
                    {{ user.name }}
                </td>

                <td>
                    {{ user.email }}
                </td>

                <td>
                    {{ user.phone }}
                </td>

                <td>
                    {{ user.get_gender_display }}
                </td>

                <td>

                    <div class="action-buttons">

                        <!-- UPDATE BUTTON -->

                        <a
                            href="{% url 'user_update' user.id %}"
                            class="update-btn">
                            Update
                        </a>


                        <!-- DELETE BUTTON -->

                        <form
                            method="POST"
                            action="{% url 'user_delete' user.id %}"
                            style="display: inline;"
                        >

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="delete-btn"
                                onclick="return confirm('Are you sure you want to delete this user?');"
                            >
                                Delete
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>


    {% else %}

        <div class="no-data">
            No users found in the database.
        </div>

    {% endif %}

</div>

</body>

</html>
