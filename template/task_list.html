<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
</head>

<body>

    <h1>My To-Do List</h1>


    {% for task in tasks %}

        <p>
            {{ task.title }}

            {% if task.completed %}
                ✅ Completed
            {% else %}
                ⏳ Pending
            {% endif %}
        </p>
        

    {% empty %}

        <p>No tasks yet.</p>

    {% endfor %}

</body>
</html>
